[package]
name = "savestates"
version.workspace = true
edition.workspace = true

[[bin]]
name = "savestates"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dunce = "1.0.5"
notify-debouncer-mini = "0.7.0"
savestates-ai = { version = "0.1.0", path = "../ai-namer" }
savestates-core = { version = "0.1.0", path = "../core" }
savestates-git = { version = "0.1.0", path = "../git" }
savestates-i18n = { version = "0.1.0", path = "../i18n" }
savestates-ui-raven = { version = "0.1.0", path = "../ui-raven" }

[dev-dependencies]
tempfile = "3.27.0"
testkit = { path = "../testkit" }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# The version information Windows shows on the exe (Explorer > Properties > Details).
[package.metadata.winresource]
ProductName = "SaveStates"
FileDescription = "SaveStates"
OriginalFilename = "savestates.exe"
LegalCopyright = "Copyright (c) SaveStates"
