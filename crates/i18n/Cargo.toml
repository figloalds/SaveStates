[package]
name = "savestates-i18n"
version.workspace = true
edition.workspace = true

[lib]
name = "savestates_i18n"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
csv = "1.4.0"
regex = "1.13.1"
